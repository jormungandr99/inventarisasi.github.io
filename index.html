#fbg{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--tx);overflow:auto}
#fbg .box{width:min(400px,100%);padding:28px;border-radius:22px}
#fbg h2{margin:0 0 4px;font:500 30px/1.1 "Fraunces",Georgia,serif;letter-spacing:-.02em}
#fbg p{margin:0 0 6px;color:var(--mu);font-size:14px}
#fbg label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}
#fbg input{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--ln2);background:var(--pns);font-size:16px;color:var(--tx)}
#fbg input:focus{outline:0;border-color:rgba(var(--acr),.6);box-shadow:0 0 0 4px rgba(var(--acr),.14)}
#fbg .go{width:100%;height:48px;margin-top:18px;border:0;border-radius:12px;font-weight:600;color:#fff;background:linear-gradient(145deg,var(--g1),var(--g2))}
:root[data-eff=dark] #fbg .go{color:#06201a}
#fbg .go:disabled{opacity:.6;cursor:wait}
#fbg .err{min-height:20px;margin-top:12px;color:#b3261e;font-size:13px}
:root[data-eff=dark] #fbg .err{color:#ff8a7a}
#fblocal{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9000;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;font-size:13px;text-align:center}
</style>
<div id="fbg" role="dialog" aria-modal="true" aria-labelledby="fbt">
  <div class="box glass">
    <h2 id="fbt">Masuk</h2>
    <p id="fbs">Memeriksa sesi…</p>
    <form id="fbf" hidden autocomplete="on">
      <label for="fbe">Email</label>
      <input id="fbe" type="email" name="email" autocomplete="username" inputmode="email" required>
      <label for="fbp">Kata sandi</label>
      <input id="fbp" type="password" name="password" autocomplete="current-password" required>
      <button class="go" id="fbb" type="submit">Masuk</button>
    </form>
    <div class="err" id="fbm" role="alert" aria-live="polite"></div>
  </div>
</div>
<script>
(function(){
  var g=document.getElementById("fbg"),menu=document.getElementById("menu"),
      sub=document.getElementById("fbs"),form=document.getElementById("fbf"),
      msg=document.getElementById("fbm"),btn=document.getElementById("fbb");
  var mode=window.__fbMode;

  /* Mode lokal: konfigurasi Firebase belum diisi, jadi aplikasi memakai penyimpanan browser saja */
  if(mode==="local"){
    g.hidden=true;
    var b=document.createElement("div");b.id="fblocal";b.className="glass";
    b.textContent="Mode lokal: Firebase belum diisi, data hanya tersimpan di browser ini.";
    document.body.appendChild(b);
    return;
  }
  if(mode==="error"){
    sub.textContent="Firebase gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.";
    if(menu)menu.inert=true;
    return;
  }

  /* Tombol keluar di bilah atas */
  var tr=document.querySelector(".top-r"),lo=null;
  if(tr){
    tr.insertAdjacentHTML("beforeend",'<button class="ibtn glass" id="fblo" type="button" aria-label="Keluar" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>');
    lo=document.getElementById("fblo");
    lo.onclick=function(){
      if(confirm("Keluar dari akun ini?"))firebase.auth().signOut().then(function(){location.reload()});
    };
  }

  /* Selama gerbang tampil, tombol pintasan portal (angka, "/") tidak boleh membuka aplikasi */
  addEventListener("keydown",function(e){
    if(!g.hidden&&!(e.target&&e.target.closest&&e.target.closest("#fbg")))e.stopImmediatePropagation();
  },true);

  function apply(){
    var st=window.__fbState;
    if(!st.known)return;
    if(st.user){
      g.hidden=true;if(menu)menu.inert=false;
      if(lo){lo.hidden=false;lo.title="Keluar ("+(st.user.email||"")+")"}
    }else{
      g.hidden=false;if(menu)menu.inert=true;
      if(lo)lo.hidden=true;
      sub.textContent="Gunakan akun yang diberikan administrator.";
      form.hidden=false;
      var e=document.getElementById("fbe");if(e&&document.activeElement!==e&&document.activeElement!==document.getElementById("fbp"))e.focus();
    }
  }
  addEventListener("fbauth",apply);
  if(menu)menu.inert=true;
  apply();

  var errs={
    "auth/invalid-credential":"Email atau kata sandi salah.",
    "auth/wrong-password":"Email atau kata sandi salah.",
    "auth/user-not-found":"Email atau kata sandi salah.",
    "auth/invalid-email":"Format email tidak valid.",
    "auth/user-disabled":"Akun ini dinonaktifkan.",
    "auth/too-many-requests":"Terlalu banyak percobaan. Coba lagi beberapa menit lagi.",
    "auth/network-request-failed":"Tidak ada koneksi internet."
  };
  form.addEventListener("submit",function(ev){
    ev.preventDefault();msg.textContent="";btn.disabled=true;btn.textContent="Memeriksa…";
    firebase.auth().signInWithEmailAndPassword(document.getElementById("fbe").value.trim(),document.getElementById("fbp").value)
      .then(function(){document.getElementById("fbp").value=""})
      .catch(function(err){msg.textContent=errs[err&&err.code]||"Gagal masuk. Coba lagi."})
      .then(function(){btn.disabled=false;btn.textContent="Masuk"});
  });
})();
</script>
</body></html>
