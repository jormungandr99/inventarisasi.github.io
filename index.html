order-color:var(--rb-line)}\n  .status-btn:hover{filter:brightness(0.96)}\n  .status-btn{touch-action:none; user-select:none}\n  table.painting{cursor:crosshair}\n  th .col-fill-wrap{display:flex; flex-direction:column; align-items:center; gap:3px; margin-top:4px}\n  .col-fill{\n    width:100%; border:1px dashed #b9c7c2; background:#fff; color:#6c8580; font-size:9.5px;\n    font-weight:700; border-radius:4px; padding:2px 0; cursor:pointer;\n  }\n  .col-fill:hover{background:#eef3ef}\n  td.day{position:relative}\n  .row-fill{\n    display:block; margin:3px auto 0; width:20px; height:20px; line-height:18px; padding:0;\n    border-radius:50%; border:1px dashed #b9c7c2; background:#fff; color:#6c8580; font-size:11px;\n    cursor:pointer;\n  }\n  .row-fill:hover{background:#eef3ef}\n  .hint{font-size:11.5px; color:#7a7568; margin:-6px 0 12px}\n  .location-row{\n    display:flex; align-items:center; gap:10px; margin-bottom:14px; background:#eef3ef;\n    border:1px solid var(--line); border-radius:10px; padding:10px 14px;\n  }\n  .location-row label{font-size:12.5px; font-weight:700; color:var(--teal-dark); white-space:nowrap}\n  .location-row input{\n    flex:1; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;\n    font-family:inherit; background:#fff; color:var(--ink);\n  }\n  .location-row input:focus{border-color:var(--teal); outline:none}\n  .chart-location{font-size:12.5px; color:#7a7568; margin:-4px 0 14px}\n  .notes-row{\n    margin-bottom:14px; background:#fdfaf1; border:1px solid #ecdfb8; border-radius:10px; padding:10px 14px;\n  }\n  .notes-row label{display:block; font-size:12.5px; font-weight:700; color:#8a6a1f; margin-bottom:6px}\n  .notes-row textarea{\n    width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;\n    font-family:inherit; background:#fff; color:var(--ink); resize:vertical; min-height:56px;\n  }\n  .notes-row textarea:focus{border-color:var(--teal); outline:none}\n  .summary{display:flex; gap:18px; margin-top:16px; flex-wrap:wrap}\n  .summary .card{\n    background:#eef3ef; border-radius:10px; padding:10px 16px; font-size:12.5px; color:var(--teal-dark);\n    display:flex; gap:8px; align-items:baseline;\n  }\n  .summary .card b{font-size:18px}\n  .mini-bar-wrap{margin-top:16px}\n  .mini-bar-wrap .mbw-label{font-size:11.5px; color:#7a7568; margin-bottom:6px; display:flex; justify-content:space-between}\n  .mini-bar{display:flex; height:16px; border-radius:6px; overflow:hidden; border:1px solid var(--line); transition:.25s}\n  .mini-bar span{display:block; height:100%; transition:width .25s ease}\n  .mini-bar .seg-ok{background:#7fc28c}\n  .mini-bar .seg-pr{background:#f0c26a}\n  .mini-bar .seg-rb{background:#e08a7d}\n  .mini-bar .seg-blank{background:#e9e6dc}\n  footer{max-width:1400px; margin:24px auto 0; padding:0 28px; font-size:11.5px; color:#9a9488}\n\n  .view-nav{display:flex; gap:6px; max-width:1400px; margin:0 auto; padding:14px 28px 0}\n  .view-btn{\n    background:rgba(255,255,255,0.5); border:1px solid var(--line); color:#5c6f6a;\n    padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer;\n  }\n  .view-btn.active{background:var(--teal-dark); color:#fff; border-color:var(--teal-dark)}\n  .view{display:none}\n  .view.active{display:block}\n  .recap-controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px}\n  .recap-controls select{\n    padding:8px 12px; border-radius:8px; border:1px solid var(--line); font-family:inherit; font-size:13.5px;\n    background:#fff; color:var(--ink);\n  }\n  .btn-teal{background:var(--teal); color:#fff}\n  .btn-teal:hover{background:var(--teal-dark)}\n  .recap-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px}\n  @media(max-width:900px){.recap-grid{grid-template-columns:1fr}}\n  .recap-card{border:1px solid var(--line); border-radius:12px; padding:16px; background:#fff}\n  .recap-card h3{margin:0 0 12px; font-size:14px; color:var(--teal-dark); display:flex; align-items:center; gap:8px}\n  .recap-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:14px}\n  .recap-table th, .recap-table td{border:1px solid var(--line); padding:6px 8px; text-align:center}\n  .recap-table th{background:#eef3ef; color:var(--teal-dark); font-size:11.5px}\n  .recap-table td.item-name{text-align:left; font-weight:600}\n  .recap-table tr.top-issue{background:var(--rb-bg)}\n  .chart-box{position:relative; height:230px; margin-bottom:8px}\n  .chart-box.tall{height:280px}\n  .issue-list{list-style:none; margin:0; padding:0; font-size:12.5px}\n  .issue-list li{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line)}\n  .issue-list li:last-child{border-bottom:none}\n  .issue-badge{background:var(--rb-bg); color:var(--rb-fg); border-radius:999px; padding:2px 10px; font-weight:700; font-size:11.5px}\n  .empty-note{color:#9a9488; font-size:12.5px; padding:20px; text-align:center}\n\n  .status-popup{\n    position:fixed; z-index:200; background:#fff; border:1px solid var(--line); border-radius:12px;\n    box-shadow:0 10px 30px rgba(20,40,38,0.22); padding:10px; display:none; min-width:190px;\n  }\n  .status-popup .popup-title{font-size:11.5px; font-weight:700; color:var(--teal-dark); margin:0 0 8px; padding:0 2px}\n  .status-popup .popup-options{display:grid; grid-template-columns:1fr 1fr; gap:6px}\n  .status-popup button.opt{\n    border-radius:8px; padding:9px 4px; font-size:12.5px; font-weight:700; cursor:pointer; border:1.5px solid;\n  }\n  .status-popup button.opt.blank{background:#fff; color:#9a9488; border-color:#d8d4c6}\n  .status-popup button.opt.OK{background:var(--ok-bg); color:var(--ok-fg); border-color:var(--ok-line)}\n  .status-popup button.opt.PR{background:var(--pr-bg); color:var(--pr-fg); border-color:var(--pr-line)}\n  .status-popup button.opt.RB{background:var(--rb-bg); color:var(--rb-fg); border-color:var(--rb-line)}\n  .status-popup button.opt:hover{filter:brightness(0.95)}\n\n  /* ===== Splash Screen ===== */\n  #splashScreen{\n    position:fixed; inset:0; z-index:900; display:flex; align-items:center; justify-content:center;\n    background:linear-gradient(135deg,var(--teal-dark),var(--teal)); color:#fff;\n    transition:opacity .6s ease, visibility .6s ease;\n  }\n  #splashScreen.hide{ opacity:0; visibility:hidden; pointer-events:none; }\n  .splash-inner{ text-align:center; }\n  .splash-logo{ font-size:56px; margin-bottom:6px; }\n  .splash-inner h1{ margin:0; font-size:26px; letter-spacing:2px; }\n  .splash-sub{ font-size:13px; opacity:.85; margin-top:4px; }\n  .splash-credit{ font-size:11px; opacity:.65; margin-top:18px; }\n  .splash-spinner{\n    width:34px; height:34px; border:3px solid rgba(255,255,255,0.3); border-top-color:#fff;\n    border-radius:50%; margin:20px auto 0; animation:spin .8s linear infinite;\n  }\n  @keyframes spin{ to{ transform:rotate(360deg); } }\n\n  /* ===== Login Page ===== */\n  #loginPage{\n    position:fixed; inset:0; z-index:800; display:none; align-items:center; justify-content:center;\n    background:\n      linear-gradient(var(--paper),var(--paper)),\n      repeating-linear-gradient(0deg, rgba(31,92,86,0.05) 0 1px, transparent 1px 40px),\n      repeating-linear-gradient(90deg, rgba(31,92,86,0.05) 0 1px, transparent 1px 40px);\n  }\n  .login-card{\n    background:#fff; border-radius:16px; padding:36px 34px; width:320px; max-width:90vw;\n    box-shadow:0 16px 46px rgba(20,40,38,0.18); text-align:center;\n  }\n  .login-logo{ font-size:40px; }\n  .login-card h2{ margin:4px 0 0; color:var(--teal-dark); letter-spacing:1px; }\n  .login-sub{ font-size:12.5px; color:#7a7568; margin-bottom:22px; }\n  .login-card label{ display:block; text-align:left; font-size:12px; font-weight:700; color:var(--teal-dark); margin:12px 0 5px; }\n  .login-card input{\n    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit;\n  }\n  .login-card input:focus{ border-color:var(--teal); outline:none; }\n  .login-card button{\n    width:100%; margin-top:20px; padding:11px; border:none; border-radius:8px; background:var(--teal); color:#fff;\n    font-weight:700; font-size:14px; cursor:pointer; font-family:inherit;\n  }\n  .login-card button:hover{ background:var(--teal-dark); }\n  #loginError{\n    display:none; margin-top:12px; background:var(--rb-bg); color:var(--rb-fg); border:1px solid var(--rb-line);\n    border-radius:8px; padding:8px 10px; font-size:12px;\n  }\n  .login-hint{ margin-top:16px; font-size:11px; color:#b3ac9d; }\n\n  /* ===== Modal (Tentang Aplikasi) ===== */\n  .modal-overlay{\n    position:fixed; inset:0; z-index:600; display:none; align-items:center; justify-content:center;\n    background:rgba(15,25,24,0.55);\n  }\n  .modal-card{\n    background:#fff; border-radius:14px; padding:26px 28px; width:380px; max-width:88vw;\n    box-shadow:0 16px 46px rgba(0,0,0,0.3);\n  }\n  .modal-card h3{ margin:0 0 4px; color:var(--teal-dark); font-size:17px; }\n  .modal-card .app-tag{ display:inline-block; background:#eef3ef; color:var(--teal-dark); font-weight:700; font-size:11px; padding:3px 9px; border-radius:999px; margin-bottom:12px; }\n  .modal-card p{ font-size:13px; line-height:1.6; color:#3a4442; margin:0 0 12px; }\n  .modal-card .dev-line{ font-size:12.5px; color:#7a7568; border-top:1px solid var(--line); padding-top:12px; }\n  .modal-card button{\n    margin-top:16px; width:100%; padding:10px; border:none; border-radius:8px; background:var(--teal); color:#fff;\n    font-weight:700; font-size:13px; cursor:pointer; font-family:inherit;\n  }\n  .modal-card button:hover{ background:var(--teal-dark); }\n\n  /* ===== Watermark ===== */\n  #watermarkBadge{\n    position:fixed; right:14px; bottom:10px; z-index:150; font-size:10.5px; color:#123a36;\n    opacity:.45; pointer-events:none; letter-spacing:.3px; user-select:none;\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv id=\"splashScreen\">\n  \u003cdiv class=\"splash-inner\">\n    \u003cdiv class=\"splash-logo\">🧼\u003c/div>\n    \u003ch1>SCK\u003c/h1>\n    \u003cdiv class=\"splash-sub\">Sistem Checklist Kebersihan\u003c/div>\n    \u003cdiv class=\"splash-spinner\">\u003c/div>\n    \u003cdiv class=\"splash-credit\">by Adamanstywn\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"loginPage\">\n  \u003cdiv class=\"login-card\">\n    \u003cdiv class=\"login-logo\">🧼\u003c/div>\n    \u003ch2>SCK\u003c/h2>\n    \u003cdiv class=\"login-sub\">Sistem Checklist Kebersihan\u003c/div>\n    \u003cform id=\"loginForm\">\n      \u003clabel for=\"loginUsername\">Username\u003c/label>\n      \u003cinput type=\"text\" id=\"loginUsername\" autocomplete=\"username\" required>\n      \u003clabel for=\"loginPassword\">Password\u003c/label>\n      \u003cinput type=\"password\" id=\"loginPassword\" autocomplete=\"current-password\" required>\n      \u003cdiv id=\"loginError\">\u003c/div>\n      \u003cbutton type=\"submit\">Masuk\u003c/button>\n    \u003c/form>\n    \u003cdiv class=\"login-hint\">Default: admin / 12345\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"modal-overlay\" id=\"aboutModal\">\n  \u003cdiv class=\"modal-card\">\n    \u003cspan class=\"app-tag\">SCK\u003c/span>\n    \u003ch3>Tentang Aplikasi\u003c/h3>\n    \u003cp>\u003cb>SCK (Sistem Checklist Kebersihan)\u003c/b>\u003cbr>\n      Aplikasi ini dibuat untuk memenuhi kebutuhan checklist kebersihan secara digital dan mudah digunakan.\n      Aplikasi ini dibuat dengan bantuan Claude Model Sonnet 5.\u003c/p>\n    \u003cdiv class=\"dev-line\">👤 Developer: \u003cb>Adamanstywn\u003c/b>\u003c/div>\n    \u003cbutton id=\"closeAboutBtn\">Tutup\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"watermarkBadge\">SCK © Adamanstywn\u003c/div>\n\n\u003cdiv id=\"appContent\" style=\"display:none\">\n\u003cheader>\n  \u003cdiv>\n    \u003ch1>🧼 Sistem Checklist Kebersihan\u003c/h1>\n    \u003cdiv class=\"sub\">Toilet &amp; Ruangan — pemeriksaan harian\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"controls\">\n    \u003cinput type=\"month\" id=\"monthPicker\">\n    \u003cbutton class=\"btn-help\" id=\"helpBtn\">❓ Tutorial\u003c/button>\n    \u003cbutton class=\"btn-help\" id=\"aboutBtn\">ℹ️ Tentang Aplikasi\u003c/button>\n    \u003cbutton class=\"btn-reset\" id=\"resetBtn\">Reset bulan ini\u003c/button>\n    \u003cbutton class=\"btn-danger\" id=\"resetAllBtn\">🗑️ Reset Semua Data\u003c/button>\n    \u003cbutton class=\"btn-print\" id=\"printMonthBtn\">🖨️ Print Laporan Bulanan\u003c/button>\n    \u003cbutton class=\"btn-export\" id=\"exportBtn\">⬇ Export ke Excel\u003c/button>\n    \u003cbutton class=\"btn-reset\" id=\"logoutBtn\">🔒 Keluar\u003c/button>\n  \u003c/div>\n\u003c/header>\n\n\u003cnav class=\"view-nav\">\n  \u003cbutton class=\"view-btn active\" data-view=\"input\">📝 Input Harian\u003c/button>\n  \u003cbutton class=\"view-btn\" data-view=\"chart\">📈 Grafik Bulanan\u003c/button>\n  \u003cbutton class=\"view-btn\" data-view=\"quarter\">🗓 Rekap Triwulan\u003c/button>\n  \u003cbutton class=\"view-btn\" data-view=\"year\">📊 Rekap Tahunan\u003c/button>\n\u003c/nav>\n\n\u003cdiv id=\"view-input\" class=\"view active wrap\">\n  \u003cdiv class=\"tabs\">\n    \u003cdiv class=\"tab active\" data-type=\"toilet\">CHECKLIST TOILET\u003c/div>\n    \u003cdiv class=\"tab\" data-type=\"ruangan\">CHECKLIST RUANGAN\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"location-row\">\n      \u003clabel for=\"locationInput\">📍 Lokasi Pemeriksaan:\u003c/label>\n      \u003cinput type=\"text\" id=\"locationInput\" placeholder=\"Contoh: Toilet Pria Lantai 2 - Gedung A\">\n    \u003c/div>\n    \u003cdiv class=\"notes-row\">\n      \u003clabel for=\"notesInput\">📝 Catatan Umum Bulan Ini (opsional)\u003c/label>\n      \u003ctextarea id=\"notesInput\" placeholder=\"Contoh: AC ruang meeting sudah dilaporkan ke teknisi tanggal 12, menunggu sparepart...\">\u003c/textarea>\n    \u003c/div>\n    \u003cdiv class=\"legend\">\n      \u003cspan>\u003cspan class=\"swatch\" style=\"background:var(--ok-bg);border:1px solid var(--ok-line)\">\u003c/span> OK = Bersih / Baik / Berfungsi\u003c/span>\n      \u003cspan>\u003cspan class=\"swatch\" style=\"background:var(--pr-bg);border:1px solid var(--pr-line)\">\u003c/span> PR = Perlu Perhatian\u003c/span>\n      \u003cspan>\u003cspan class=\"swatch\" style=\"background:var(--rb-bg);border:1px solid var(--rb-line)\">\u003c/span> RB = Rusak / Bermasalah\u003c/span>\n      \u003cspan class=\"save-indicator\" id=\"saveIndicator\">Tersimpan otomatis\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"hint\">💡 Isi cepat: \u003cb>klik sel status\u003c/b> untuk memilih indikator lewat popup (OK/PR/RB/Kosong) · \u003cb>klik &amp; seret\u003c/b> melewati beberapa sel untuk menyamakan nilainya · tombol \"isi kolom\" / ⚡ mengisi satu kolom atau satu baris penuh lewat popup juga\u003c/div>\n    \u003cdiv id=\"tableHost\">\u003c/div>\n    \u003cdiv class=\"summary\" id=\"summaryHost\">\u003c/div>\n    \u003cdiv class=\"mini-bar-wrap\">\n      \u003cdiv class=\"mbw-label\">\u003cspan>📊 Komposisi real-time bulan ini\u003c/span>\u003cspan id=\"miniBarPct\">\u003c/span>\u003c/div>\n      \u003cdiv class=\"mini-bar\" id=\"miniBar\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"view-chart\" class=\"view wrap\">\n  \u003cdiv class=\"tabs\">\n    \u003cdiv class=\"tab active\" data-charttype=\"toilet\">TOILET\u003c/div>\n    \u003cdiv class=\"tab\" data-charttype=\"ruangan\">RUANGAN\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"hint\" style=\"margin-top:0\">Grafik mengikuti bulan yang dipilih di kanan atas (\u003cb id=\"chartMonthLabel\">\u003c/b>). Kalau grafik belum muncul, klik tombol di samping.\u003c/div>\n    \u003cbutton class=\"btn-teal\" id=\"refreshChartBtn\" style=\"margin-bottom:14px\">🔄 Refresh Grafik\u003c/button>\n    \u003cdiv id=\"chartErrorBox\" style=\"display:none; background:#fbe4e2; border:1px solid #e9a89f; color:#a3352b; border-radius:8px; padding:10px 14px; font-size:12.5px; margin-bottom:14px\">\u003c/div>\n    \u003cdiv class=\"chart-location\">📍 Lokasi: \u003cb id=\"chartLocationLabel\">-\u003c/b>\u003c/div>\n    \u003cdiv class=\"recap-card\" style=\"margin-bottom:18px\">\n      \u003ch3>📅 Komposisi status per hari\u003c/h3>\n      \u003cdiv class=\"chart-box tall\">\u003ccanvas id=\"chartDaily\">\u003c/canvas>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"recap-grid\">\n      \u003cdiv class=\"recap-card\">\n        \u003ch3>📉 Tren item bermasalah (PR + RB) per hari\u003c/h3>\n        \u003cdiv class=\"chart-box\">\u003ccanvas id=\"chartTrend\">\u003c/canvas>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"recap-card\">\n        \u003ch3>🔧 Item paling sering bermasalah bulan ini\u003c/h3>\n        \u003cdiv class=\"chart-box\">\u003ccanvas id=\"chartItems\">\u003c/canvas>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"view-quarter\" class=\"view wrap\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"recap-controls\">\n      \u003clabel>Triwulan:\n        \u003cselect id=\"quarterSelect\">\n          \u003coption value=\"1\">Q1 (Jan–Mar)\u003c/option>\n          \u003coption value=\"2\">Q2 (Apr–Jun)\u003c/option>\n          \u003coption value=\"3\">Q3 (Jul–Sep)\u003c/option>\n          \u003coption value=\"4\">Q4 (Okt–Des)\u003c/option>\n        \u003c/select>\n      \u003c/label>\n      \u003clabel>Tahun: \u003cselect id=\"quarterYear\">\u003c/select>\u003c/label>\n      \u003cbutton class=\"btn-teal\" id=\"quarterLoadBtn\">Tampilkan Rekap\u003c/button>\n      \u003cbutton class=\"btn-print-inline\" id=\"printQuarterBtn\" style=\"border-radius:8px\">🖨️ Print Rekap Triwulan\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"quarterHost\">\u003cdiv class=\"empty-note\">Pilih triwulan dan tahun, lalu klik \"Tampilkan Rekap\".\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"view-year\" class=\"view wrap\">\n  \u003cdiv class=\"panel\">\n    \u003cdiv class=\"recap-controls\">\n      \u003clabel>Tahun: \u003cselect id=\"yearSelect\">\u003c/select>\u003c/label>\n      \u003cbutton class=\"btn-teal\" id=\"yearLoadBtn\">Tampilkan Rekap\u003c/button>\n      \u003cbutton class=\"btn-print-inline\" id=\"printYearBtn\" style=\"border-radius:8px\">🖨️ Print Rekap Tahunan\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"yearHost\">\u003cdiv class=\"empty-note\">Pilih tahun, lalu klik \"Tampilkan Rekap\".\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cfooter>Data tersimpan otomatis per perangkat/akun. Klik sel status untuk memilih nilai, atau klik &amp; seret untuk isi cepat beberapa sel sekaligus.\u003c/footer>\n\n\u003cdiv class=\"status-popup\" id=\"statusPopup\">\n  \u003cp class=\"popup-title\" id=\"popupTitle\">Pilih indikator\u003c/p>\n  \u003cdiv class=\"popup-options\">\n    \u003cbutton class=\"opt blank\" data-val=\"\">— Kosong\u003c/button>\n    \u003cbutton class=\"opt OK\" data-val=\"OK\">OK\u003c/button>\n    \u003cbutton class=\"opt PR\" data-val=\"PR\">PR\u003c/button>\n    \u003cbutton class=\"opt RB\" data-val=\"RB\">RB\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"tutorialOverlay\">\n  \u003cdiv id=\"tutorialSpotlight\">\u003c/div>\n  \u003cdiv id=\"tutorialCard\">\n    \u003cdiv class=\"tstep\" id=\"tStep\">\u003c/div>\n    \u003ch4 id=\"tTitle\">\u003c/h4>\n    \u003cp id=\"tDesc\">\u003c/p>\n    \u003cdiv class=\"tbuttons\">\n      \u003cdiv class=\"tleft\">\n        \u003cbutton class=\"t-skip\" id=\"tSkip\">Lewati\u003c/button>\n        \u003cbutton class=\"t-prev\" id=\"tPrev\">← Kembali\u003c/button>\n      \u003c/div>\n      \u003cbutton class=\"t-next\" id=\"tNext\">Lanjut →\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c/div>\u003c!-- /#appContent -->\n\n\u003cscript>\nconst SCHEMA = {\n  toilet: {\n    label: \"TOILET\",\n    title: \"ITEM LIST PEMERIKSAAN KEBERSIHAN TOILET\",\n    groups: [\n      { name: \"KEBERSIHAN UMUM\", cols: [\"LANTAI\",\"DINDING\",\"SALURAN AIR\",\"VENTILASI\",\"PENERANGAN\"] },\n      { name: \"FASILITAS TOILET\", cols: [\"KLOSET\",\"URINOIR\",\"WASTAFEL\",\"SABUN CUCI TANGAN\",\"KRAN AIR\",\"TEMPAT SAMPAH\",\"PENGERING TANGAN\"] },\n      { name: \"HIGENITAS\", cols: [\"BAU\",\"SERANGGA\",\"SANITASI\"] }\n    ]\n  },\n  ruangan: {\n    label: \"RUANGAN\",\n    title: \"ITEM LIST PEMERIKSAAN KEBERSIHAN RUANGAN\",\n    groups: [\n      { name: \"KEBERSIHAN DAN KERAPIAN\", cols: [\"LANTAI\",\"DINDING\",\"MEJA\"] },\n      { name: \"FASILITAS DAN PERABOT\", cols: [\"KOMPUTER\",\"DISPENSER\",\"AC\"] },\n      { name: \"PENERANGAN\", cols: [\"LAMPU\",\"PENCAHAYAAN\",\"VENTILASI\",\"JENDELA\"] },\n      { name: \"KELISTRIKAN\", cols: [\"STOP KONTAK\",\"KABEL LISTRIK\"] },\n      { name: \"KEAMANAN DAN KESELAMATAN\", cols: [\"APAR\",\"JALUR EVAKUASI\"] }\n    ]\n  }\n};\nconst STATUS_CYCLE = [\"\", \"OK\", \"PR\", \"RB\"];\nconst BULAN_ID = [\"Januari\",\"Februari\",\"Maret\",\"April\",\"Mei\",\"Juni\",\"Juli\",\"Agustus\",\"September\",\"Oktober\",\"November\",\"Desember\"];\n\nlet activeType = \"toilet\";\nlet monthKey = new Date().toISOString().slice(0,7); // YYYY-MM\nlet cache = { toilet: null, ruangan: null };\n\nfunction flatCols(type){ return SCHEMA[type].groups.flatMap(g => g.cols); }\nfunction daysInMonth(mKey){\n  const [y,m] = mKey.split(\"-\").map(Number);\n  return new Date(y, m, 0).getDate();\n}\nfunction blankRows(type, mKey){\n  const n = daysInMonth(mKey);\n  const cols = flatCols(type);\n  const rows = [];\n  for(let d=1; d\u003c=n; d++){\n    const values = {};\n    cols.forEach(c => values[c] = \"\");\n    rows.push({ day:d, petugas:\"\", values, keterangan:\"\" });\n  }\n  return rows;\n}\nfunction storageKey(type, mKey){ return `checklist:${type}:${mKey}`; }\nfunction storageKeyLocation(type, mKey){ return `checklist:lokasi:${type}:${mKey}`; }\nfunction storageKeyNotes(type, mKey){ return `checklist:catatan:${type}:${mKey}`; }\n\n// Persist data in the browser's own localStorage so it survives refresh / reopening the file.\nconst storage = {\n  // Memakai Firestore (koleksi \"checklist\") bila tersedia; kalau tidak, memakai localStorage seperti semula.\n  async _db(){\n    try{ return (window.claude && await claude.use(\"db\")) || null; }\n    catch(e){ return null; }\n  },\n  async get(key){\n    const db = await this._db();\n    if(db){\n      const s = await db.doc(\"checklist/\" + key).get();\n      if(!s.exists) throw new Error(\"key not found\");\n      return { key, value: s.data().v };\n    }\n    let v;\n    try{ v = localStorage.getItem(key); }\n    catch(e){ throw new Error(\"localStorage tidak tersedia: \" + e.message); }\n    if(v === null) throw new Error(\"key not found\");\n    return { key, value: v };\n  },\n  async set(key, value){\n    const db = await this._db();\n    if(db){\n      await db.doc(\"checklist/\" + key).set({ v: value });\n      return { key, value };\n    }\n    try{ localStorage.setItem(key, value); return { key, value }; }\n    catch(e){ return null; }\n  }\n};\n\nasync function loadLocation(type, mKey){\n  try{\n    const res = await storage.get(storageKeyLocation(type, mKey));\n    if(res && typeof res.value === \"string\") return res.value;\n  }catch(e){ /* not found */ }\n  return \"\";\n}\nasync function loadNotes(type, mKey){\n  try{\n    const res = await storage.get(storageKeyNotes(type, mKey));\n    if(res && typeof res.value === \"string\") return res.value;\n  }catch(e){ /* not found */ }\n  return \"\";\n}\nlet locationSaveTimer = null;\nfunction scheduleSaveLocation(type, mKey, value){\n  clearTimeout(locationSaveTimer);\n  locationSaveTimer = setTimeout(async () => {\n    try{ await storage.set(storageKeyLocation(type, mKey), value); }catch(e){ /* ignore */ }\n  }, 400);\n}\nlet notesSaveTimer = null;\nfunction scheduleSaveNotes(type, mKey, value){\n  clearTimeout(notesSaveTimer);\n  notesSaveTimer = setTimeout(async () => {\n    try{ await storage.set(storageKeyNotes(type, mKey), value); }catch(e){ /* ignore */ }\n  }, 400);\n}\n\nasync function loadData(type, mKey){\n  try{\n    const res = await storage.get(storageKey(type, mKey));\n    if(res && res.value){\n      const parsed = JSON.parse(res.value);\n      const n = daysInMonth(mKey);\n      if(parsed.length === n) return parsed;\n    }\n  }catch(e){ /* not found */ }\n  return blankRows(type, mKey);\n}\nlet saveTimer = null;\nfunction scheduleSave(type){\n  const indicator = document.getElementById(\"saveIndicator\");\n  indicator.textContent = \"Menyimpan...\";\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(async () => {\n    try{\n      await storage.set(storageKey(type, monthKey), JSON.stringify(cache[type]));\n      indicator.textContent = \"Tersimpan otomatis ✓\";\n    }catch(e){\n      indicator.textContent = \"Gagal menyimpan — coba lagi\";\n    }\n  }, 400);\n}\n\nfunction renderTable(){\n  const type = activeType;\n  const schema = SCHEMA[type];\n  const cols = flatCols(type);\n  const rows = cache[type];\n\n  let thead = \"\u003cthead>\u003ctr>\u003cth rowspan='2'>Tgl\u003c/th>\u003cth rowspan='2'>Petugas\u003c/th>\";\n  schema.groups.forEach(g => thead += `\u003cth colspan='${g.cols.length}'>${g.name}\u003c/th>`);\n  thead += \"\u003cth rowspan='2'>Keterangan\u003c/th>\u003c/tr>\u003ctr>\";\n  cols.forEach(c => thead += `\u003cth>${c}\u003cdiv class=\"col-fill-wrap\">\u003cbutton class=\"col-fill\" data-col=\"${escapeAttr(c)}\" title=\"Klik untuk memilih nilai satu kolom penuh\">isi kolom\u003c/button>\u003c/div>\u003c/th>`);\n  thead += \"\u003c/tr>\u003c/thead>\";\n\n  let tbody = \"\u003ctbody>\";\n  rows.forEach((row, ri) => {\n    tbody += `\u003ctr>\u003ctd class=\"day\">${row.day}\u003cbutton class=\"row-fill\" data-ri=\"${ri}\" title=\"Klik untuk memilih nilai satu baris penuh\">⚡\u003c/button>\u003c/td>`;\n    tbody += `\u003ctd class=\"petugas\">\u003cinput data-ri=\"${ri}\" data-field=\"petugas\" value=\"${escapeAttr(row.petugas)}\" placeholder=\"-\">\u003c/td>`;\n    cols.forEach(c => {\n      const v = row.values[c] || \"\";\n      tbody += `\u003ctd>\u003cbutton class=\"status-btn ${v}\" data-ri=\"${ri}\" data-col=\"${escapeAttr(c)}\">${v || \"—\"}\u003c/button>\u003c/td>`;\n    });\n    tbody += `\u003ctd class=\"ket\">\u003cinput data-ri=\"${ri}\" data-field=\"keterangan\" value=\"${escapeAttr(row.keterangan)}\" placeholder=\"-\">\u003c/td>`;\n    tbody += \"\u003c/tr>\";\n  });\n  tbody += \"\u003c/tbody>\";\n\n  document.getElementById(\"tableHost\").innerHTML = `\u003ctable>${thead}${tbody}\u003c/table>`;\n  attachHandlers();\n  renderSummary();\n}\nfunction escapeAttr(s){ return String(s||\"\").replace(/\"/g,\"&quot;\"); }\n\nfunction attachHandlers(){\n  const type = activeType;\n  document.querySelectorAll('input[data-field]').forEach(inp => {\n    inp.addEventListener(\"input\", () => {\n      const ri = +inp.dataset.ri, field = inp.dataset.field;\n      cache[type][ri][field] = inp.value;\n      scheduleSave(type);\n    });\n  });\n  document.querySelectorAll(\".col-fill\").forEach(btn => {\n    btn.addEventListener(\"click\", () => openPopup(btn, \"col\", null, btn.dataset.col));\n  });\n  document.querySelectorAll(\".row-fill\").forEach(btn => {\n    btn.addEventListener(\"click\", () => openPopup(btn, \"row\", +btn.dataset.ri, null));\n  });\n}\n\n// --- Click = popup chooser, Drag = paint multiple cells at once ---\nlet isPainting = false;\nlet paintStatus = \"\";\nlet dragCandidate = null; // {ri, col, btn} set on pointerdown, cleared on pointerup\n\nfunction setCellStatus(ri, col, status){\n  cache[activeType][ri].values[col] = status;\n  const btn = document.querySelector(`.status-btn[data-ri=\"${ri}\"][data-col=\"${cssAttrEscape(col)}\"]`);\n  if(btn){ btn.textContent = status || \"—\"; btn.className = \"status-btn \" + status; }\n}\nfunction cssAttrEscape(s){ return String(s).replace(/\"/g,'\\\\\"'); }\n\ndocument.addEventListener(\"pointerdown\", (e) => {\n  const btn = e.target.closest(\".status-btn\");\n  if(!btn) return;\n  dragCandidate = { ri:+btn.dataset.ri, col: btn.dataset.col, btn };\n  isPainting = false;\n});\ndocument.addEventListener(\"pointermove\", (e) => {\n  if(!dragCandidate) return;\n  const el = document.elementFromPoint(e.clientX, e.clientY);\n  const hoverBtn = el && el.closest && el.closest(\".status-btn\");\n  if(!hoverBtn) return;\n  if(!isPainting){\n    if(hoverBtn === dragCandidate.btn) return; // still on the same cell, not a drag yet\n    const cur = cache[activeType][dragCandidate.ri].values[dragCandidate.col] || \"\";\n    paintStatus = STATUS_CYCLE[(STATUS_CYCLE.indexOf(cur)+1) % STATUS_CYCLE.length];\n    isPainting = true;\n    setCellStatus(dragCandidate.ri, dragCandidate.col, paintStatus);\n    scheduleSave(activeType);\n    renderSummary();\n    const tbl = document.querySelector(\"#tableHost table\");\n    if(tbl) tbl.classList.add(\"painting\");\n  }\n  const ri = +hoverBtn.dataset.ri, col = hoverBtn.dataset.col;\n  if((cache[activeType][ri].values[col] || \"\") !== paintStatus){\n    setCellStatus(ri, col, paintStatus);\n    scheduleSave(activeType);\n    renderSummary();\n  }\n});\ndocument.addEventListener(\"pointerup\", () => {\n  if(dragCandidate && !isPainting){\n    openPopup(dragCandidate.btn, \"cell\", dragCandidate.ri, dragCandidate.col);\n  }\n  dragCandidate = null;\n  stopPainting();\n});\ndocument.addEventListener(\"pointercancel\", () => { dragCandidate = null; stopPainting(); });\nfunction stopPainting(){\n  isPainting = false;\n  const tbl = document.querySelector(\"#tableHost table\");\n  if(tbl) tbl.classList.remove(\"painting\");\n}\n\n// --- Indicator choice popup (used for single cell, whole column, or whole row) ---\nlet popupTarget = null; // {mode:'cell'|'col'|'row', ri, col}\nconst statusPopupEl = document.getElementById(\"statusPopup\");\n\nfunction openPopup(anchorEl, mode, ri, col){\n  popupTarget = { mode, ri, col };\n  document.getElementById(\"popupTitle\").textContent =\n    mode === \"cell\" ? `Hari ${cache[activeType][ri].day} • ${col}` :\n    mode === \"col\" ? `Isi kolom \"${col}\" (semua tanggal)` :\n    `Isi baris tanggal ${cache[activeType][ri].day} (semua kolom)`;\n  statusPopupEl.style.display = \"block\";\n  const rect = anchorEl.getBoundingClientRect();\n  const pw = statusPopupEl.offsetWidth || 190;\n  let left = rect.left + rect.width/2 - pw/2;\n  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));\n  let top = rect.bottom + 6;\n  if(top + 100 > window.innerHeight) top = rect.top - 106;\n  statusPopupEl.style.left = left + \"px\";\n  statusPopupEl.style.top = top + \"px\";\n}\nfunction closePopup(){\n  statusPopupEl.style.display = \"none\";\n  popupTarget = null;\n}\nstatusPopupEl.querySelectorAll(\"button[data-val]\").forEach(optBtn => {\n  optBtn.addEventListener(\"click\", (e) => {\n    e.stopPropagation();\n    if(!popupTarget) return;\n    const val = optBtn.dataset.val;\n    const type = activeType;\n    if(popupTarget.mode === \"cell\"){\n      setCellStatus(popupTarget.ri, popupTarget.col, val);\n      scheduleSave(type);\n      renderSummary();\n    } else if(popupTarget.mode === \"col\"){\n      cache[type].forEach(row => row.values[popupTarget.col] = val);\n      scheduleSave(type);\n      renderTable();\n    } else if(popupTarget.mode === \"row\"){\n      flatCols(type).forEach(c => cache[type][popupTarget.ri].values[c] = val);\n      scheduleSave(type);\n      renderTable();\n    }\n    closePopup();\n  });\n});\ndocument.addEventListener(\"pointerdown\", (e) => {\n  if(statusPopupEl.style.display === \"none\") return;\n  if(statusPopupEl.contains(e.target)) return;\n  if(e.target.closest(\".status-btn\") || e.target.closest(\".col-fill\") || e.target.closest(\".row-fill\")) return;\n  closePopup();\n});\nwindow.addEventListener(\"resize\", closePopup);\nwindow.addEventListener(\"scroll\", closePopup, true);\n\nfunction renderSummary(){\n  const type = activeType;\n  const cols = flatCols(type);\n  let ok=0, pr=0, rb=0, blank=0;\n  cache[type].forEach(row => cols.forEach(c => {\n    const v = row.values[c];\n    if(v===\"OK\") ok++; else if(v===\"PR\") pr++; else if(v===\"RB\") rb++; else blank++;\n  }));\n  document.getElementById(\"summaryHost\").innerHTML = `\n    \u003cdiv class=\"card\">✅ OK \u003cb>${ok}\u003c/b>\u003c/div>\n    \u003cdiv class=\"card\">⚠️ Perlu Perhatian \u003cb>${pr}\u003c/b>\u003c/div>\n    \u003cdiv class=\"card\">🛑 Rusak/Bermasalah \u003cb>${rb}\u003c/b>\u003c/div>\n    \u003cdiv class=\"card\">— Belum diisi \u003cb>${blank}\u003c/b>\u003c/div>\n  `;\n\n  const total = ok+pr+rb+blank;\n  const pct = n => total ? (n/total*100) : 0;\n  const miniBar = document.getElementById(\"miniBar\");\n  if(miniBar){\n    miniBar.innerHTML = `\n      \u003cspan class=\"seg-ok\" style=\"width:${pct(ok)}%\">\u003c/span>\n      \u003cspan class=\"seg-pr\" style=\"width:${pct(pr)}%\">\u003c/span>\n      \u003cspan class=\"seg-rb\" style=\"width:${pct(rb)}%\">\u003c/span>\n      \u003cspan class=\"seg-blank\" style=\"width:${pct(blank)}%\">\u003c/span>`;\n    const filled = total - blank;\n    document.getElementById(\"miniBarPct\").textContent = total ? `${Math.round(filled/total*100)}% terisi` : \"\";\n  }\n  refreshChartIfActive();\n}\nfunction refreshChartIfActive(){\n  const el = document.getElementById(\"view-chart\");\n  if(el && el.classList.contains(\"active\")) renderChartView();\n}\n\nlet currentLocation = \"\";\nlet currentNotes = \"\";\nasync function loadCurrentLocation(){\n  currentLocation = await loadLocation(activeType, monthKey);\n  const inp = document.getElementById(\"locationInput\");\n  if(inp) inp.value = currentLocation;\n}\nasync function loadCurrentNotes(){\n  currentNotes = await loadNotes(activeType, monthKey);\n  const ta = document.getElementById(\"notesInput\");\n  if(ta) ta.value = currentNotes;\n}\ndocument.getElementById(\"locationInput\").addEventListener(\"input\", (e) => {\n  currentLocation = e.target.value;\n  scheduleSaveLocation(activeType, monthKey, currentLocation);\n});\ndocument.getElementById(\"notesInput\").addEventListener(\"input\", (e) => {\n  currentNotes = e.target.value;\n  scheduleSaveNotes(activeType, monthKey, currentNotes);\n});\n\nasync function switchType(type){\n  activeType = type;\n  document.querySelectorAll(\".tab\").forEach(t => t.classList.toggle(\"active\", t.dataset.type===type));\n  if(!cache[type]) cache[type] = await loadData(type, monthKey);\n  renderTable();\n  await loadCurrentLocation();\n  await loadCurrentNotes();\n}\n\nasync function switchMonth(mKey){\n  monthKey = mKey;\n  cache.toilet = await loadData(\"toilet\", monthKey);\n  cache.ruangan = await loadData(\"ruangan\", monthKey);\n  renderTable();\n  await loadCurrentLocation();\n  await loadCurrentNotes();\n  if(document.getElementById(\"view-chart\").classList.contains(\"active\")) renderChartView();\n}\n\nasync function resetMonth(){\n  if(!confirm(\"Kosongkan semua isian checklist untuk bulan ini?\")) return;\n  cache[activeType] = blankRows(activeType, monthKey);\n  await storage.set(storageKey(activeType, monthKey), JSON.stringify(cache[activeType]));\n  renderTable();\n}\n\nfunction buildSheetAOA(type, mKey, location, notes){\n  const schema = SCHEMA[type];\n  const cols = flatCols(type);\n  const totalCols = 2 + cols.length + 1; // Tanggal, Petugas, ...items, Keterangan\n  const pad = (arr) => { while(arr.length \u003c totalCols) arr.push(\"\"); return arr; };\n\n  const aoa = [];\n  aoa.push(pad([]));\n  aoa.push(pad([`CHECKLIST PEMERIKSAAN ${schema.label} — ${monthLabel(mKey)}`]));\n  aoa.push(pad([`LOKASI: ${location && location.trim() ? location.trim() : \"-\"}`]));\n  aoa.push(pad([]));\n  aoa.push(pad([schema.title]));\n\n  const headerRow1 = [\"TANGGAL\",\"PETUGAS\"];\n  schema.groups.forEach(g => { headerRow1.push(g.name); g.cols.slice(1).forEach(()=>headerRow1.push(\"\")); });\n  headerRow1.push(\"KETERANGAN\");\n  aoa.push(pad(headerRow1));\n\n  const headerRow2 = [\"\",\"\"];\n  cols.forEach(c => headerRow2.push(c));\n  headerRow2.push(\"\");\n  aoa.push(pad(headerRow2));\n\n  const dataStartRow = aoa.length;\n  const rows = cache[type];\n  rows.forEach(row => {\n    const line = [row.day, row.petugas];\n    cols.forEach(c => line.push(row.values[c] || \"\"));\n    line.push(row.keterangan);\n    aoa.push(pad(line));\n  });\n\n  aoa.push(pad([]));\n  aoa.push(pad([\"KETERANGAN CHECKLIST:\"]));\n  aoa.push(pad([\"OK = BERSIH / BAIK / BERFUNGSI\"]));\n  aoa.push(pad([\"PR = PERLU PERHATIAN\"]));\n  aoa.push(pad([\"RB = RUSAK / BERMASALAH\"]));\n\n  aoa.push(pad([]));\n  aoa.push(pad([\"CATATAN UMUM:\"]));\n  const noteLines = (notes && notes.trim()) ? notes.trim().split(\"\\n\") : [\"-\"];\n  noteLines.forEach(line => aoa.push(pad([line])));\n\n  aoa.push(pad([]));\n  aoa.push(pad([\"SCK (Sistem Checklist Kebersihan) — dikembangkan oleh Adamanstywn\"]));\n\n  const merges = [];\n  merges.push({ s:{r:1,c:0}, e:{r:1,c:totalCols-1} }); // title\n  merges.push({ s:{r:2,c:0}, e:{r:2,c:totalCols-1} }); // lokasi\n  merges.push({ s:{r:4,c:0}, e:{r:4,c:totalCols-1} }); // subtitle\n  merges.push({ s:{r:5,c:0}, e:{r:6,c:0} }); // TANGGAL rowspan\n  merges.push({ s:{r:5,c:1}, e:{r:6,c:1} }); // PETUGAS rowspan\n  merges.push({ s:{r:5,c:totalCols-1}, e:{r:6,c:totalCols-1} }); // KETERANGAN rowspan\n  let cIdx = 2;\n  schema.groups.forEach(g => {\n    if(g.cols.length > 1) merges.push({ s:{r:5,c:cIdx}, e:{r:5,c:cIdx+g.cols.length-1} });\n    cIdx += g.cols.length;\n  });\n  const noteStartRow = aoa.length - noteLines.length;\n  for(let i=0; i\u003cnoteLines.length; i++) merges.push({ s:{r:noteStartRow+i,c:0}, e:{r:noteStartRow+i,c:totalCols-1} });\n\n  return { aoa, merges, colCount: totalCols, dataStartRow, rowCount: rows.length };\n}\n\nfunction monthLabel(mKey){\n  const [y,m] = mKey.split(\"-\").map(Number);\n  return `${BULAN_ID[m-1]} ${y}`;\n}\n\nasync function exportExcel(){\n  // make sure both datasets for the current month are loaded\n  const toiletData = cache.toilet && cache.toilet.length === daysInMonth(monthKey) ? cache.toilet : await loadData(\"toilet\", monthKey);\n  const ruanganData = cache.ruangan && cache.ruangan.length === daysInMonth(monthKey) ? cache.ruangan : await loadData(\"ruangan\", monthKey);\n  cache.toilet = toiletData; cache.ruangan = ruanganData;\n  const toiletLoc = activeType===\"toilet\" ? currentLocation : await loadLocation(\"toilet\", monthKey);\n  const ruanganLoc = activeType===\"ruangan\" ? currentLocation : await loadLocation(\"ruangan\", monthKey);\n  const toiletNotes = activeType===\"toilet\" ? currentNotes : await loadNotes(\"toilet\", monthKey);\n  const ruanganNotes = activeType===\"ruangan\" ? currentNotes : await loadNotes(\"ruangan\", monthKey);\n  const locations = { toilet: toiletLoc, ruangan: ruanganLoc };\n  const notesByType = { toilet: toiletNotes, ruangan: ruanganNotes };\n\n  const wb = XLSX.utils.book_new();\n  [\"toilet\",\"ruangan\"].forEach(type => {\n    const { aoa, merges, colCount } = buildSheetAOA(type, monthKey, locations[type], notesByType[type]);\n    const ws = XLSX.utils.aoa_to_sheet(aoa);\n    ws[\"!merges\"] = merges;\n    ws[\"!cols\"] = Array.from({length:colCount}, (_,i) => ({ wch: i===0?6:(i===1?14:(i===colCount-1?20:12)) }));\n    XLSX.utils.book_append_sheet(wb, ws, type===\"toilet\" ? \"CHECKLIST TOILET\" : \"CHECKLIST RUANGAN\");\n  });\n  const fname = `Checklist_Kebersihan_${monthKey}.xlsx`;\n  try{const D=window.claude&&await claude.use(\"downloads\");if(D){await D.save({filename:fname,data:XLSX.write(wb,{type:\"array\",bookType:\"xlsx\"})});return}}catch(e){if(e&&e.code==\"declined\")return}\n  XLSX.writeFile(wb, fname);\n}\n\n// ===================== VIEW SWITCHING =====================\nfunction switchView(view){\n  document.querySelectorAll(\".view-btn\").forEach(b => b.classList.toggle(\"active\", b.dataset.view===view));\n  document.querySelectorAll(\".view\").forEach(v => v.classList.toggle(\"active\", v.id === \"view-\"+view));\n  if(view===\"chart\") renderChartView();\n}\ndocument.querySelectorAll(\".view-btn\").forEach(b => b.addEventListener(\"click\", () => switchView(b.dataset.view)));\n\n// ===================== STATS HELPER =====================\nasync function getMonthStats(type, mKey){\n  const rows = await loadData(type, mKey);\n  const cols = flatCols(type);\n  let ok=0, pr=0, rb=0, blank=0;\n  const perItem = {}; cols.forEach(c => perItem[c] = {ok:0,pr:0,rb:0});\n  rows.forEach(row => cols.forEach(c => {\n    const v = row.values[c];\n    if(v===\"OK\"){ ok++; perItem[c].ok++; }\n    else if(v===\"PR\"){ pr++; perItem[c].pr++; }\n    else if(v===\"RB\"){ rb++; perItem[c].rb++; }\n    else blank++;\n  }));\n  return { ok, pr, rb, blank, total: ok+pr+rb+blank, perItem };\n}\n\n// ===================== GRAFIK BULANAN =====================\nlet chartType = \"toilet\";\nlet chartInstances = {};\nfunction destroyChart(id){ if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; } }\n\nconst CHART_CDN_URLS = [\n  \"https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js\",\n  \"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js\",\n  \"https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js\"\n];\nfunction loadScriptOnce(url){\n  return new Promise((resolve, reject) => {\n    const s = document.createElement(\"script\");\n    s.src = url;\n    s.onload = () => resolve();\n    s.onerror = () => reject(new Error(\"gagal memuat \" + url));\n    document.head.appendChild(s);\n  });\n}\nlet chartLoadPromise = null;\nfunction ensureChartLoaded(){\n  if(typeof Chart !== \"undefined\") return Promise.resolve(true);\n  if(chartLoadPromise) return chartLoadPromise;\n  chartLoadPromise = (async () => {\n    for(const url of CHART_CDN_URLS){\n      try{\n        await loadScriptOnce(url);\n        if(typeof Chart !== \"undefined\") return true;\n      }catch(e){ /* try next CDN */ }\n    }\n    chartLoadPromise = null; // allow retrying later (e.g. after connection restored)\n    return false;\n  })();\n  return chartLoadPromise;\n}\n\nasync function renderChartView(){\n  const errBox = document.getElementById(\"chartErrorBox\");\n  errBox.style.display = \"none\";\n  try{\n    const chartReady = await ensureChartLoaded();\n    if(!chartReady){\n      throw new Error(\"Library grafik (Chart.js) gagal dimuat dari semua sumber CDN yang dicoba. Cek koneksi internet Anda, lalu klik Refresh Grafik lagi.\");\n    }\n    const type = chartType;\n    document.getElementById(\"chartMonthLabel\").textContent = monthLabel(monthKey);\n    const loc = (type===activeType) ? currentLocation : await loadLocation(type, monthKey);\n    document.getElementById(\"chartLocationLabel\").textContent = loc && loc.trim() ? loc.trim() : \"- (belum diisi)\";\n    const rows = (cache[type] && cache[type].length === daysInMonth(monthKey)) ? cache[type] : await loadData(type, monthKey);\n    const cols = flatCols(type);\n    const days = rows.map(r => r.day);\n    const okArr=[], prArr=[], rbArr=[], issueArr=[];\n    rows.forEach(row => {\n      let ok=0, pr=0, rb=0;\n      cols.forEach(c => { const v=row.values[c]; if(v===\"OK\") ok++; else if(v===\"PR\") pr++; else if(v===\"RB\") rb++; });\n      okArr.push(ok); prArr.push(pr); rbArr.push(rb); issueArr.push(pr+rb);\n    });\n    const perItem = {}; cols.forEach(c => perItem[c]=0);\n    rows.forEach(row => cols.forEach(c => { const v=row.values[c]; if(v===\"PR\"||v===\"RB\") perItem[c]++; }));\n    const itemEntries = Object.entries(perItem).sort((a,b)=>b[1]-a[1]).slice(0,8);\n\n    destroyChart(\"chartDaily\");\n    chartInstances[\"chartDaily\"] = new Chart(document.getElementById(\"chartDaily\"), {\n      type:\"bar\",\n      data:{ labels:days, datasets:[\n        {label:\"OK\", data:okArr, backgroundColor:\"#7fc28c\"},\n        {label:\"PR\", data:prArr, backgroundColor:\"#f0c26a\"},\n        {label:\"RB\", data:rbArr, backgroundColor:\"#e08a7d\"}\n      ]},\n      options:{ responsive:true, maintainAspectRatio:false,\n        scales:{ x:{stacked:true, title:{display:true, text:\"Tanggal\"}}, y:{stacked:true, beginAtZero:true, ticks:{stepSize:1}} },\n        plugins:{legend:{position:\"bottom\"}} }\n    });\n\n    destroyChart(\"chartTrend\");\n    chartInstances[\"chartTrend\"] = new Chart(document.getElementById(\"chartTrend\"), {\n      type:\"line\",\n      data:{ labels:days, datasets:[{ label:\"Item bermasalah (PR+RB)\", data:issueArr, borderColor:\"#a3352b\", backgroundColor:\"rgba(163,53,43,0.15)\", fill:true, tension:0.3, pointRadius:3 }] },\n      options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{beginAtZero:true, ticks:{stepSize:1}} }, plugins:{legend:{display:false}} }\n    });\n\n    destroyChart(\"chartItems\");\n    chartInstances[\"chartItems\"] = new Chart(document.getElementById(\"chartItems\"), {\n      type:\"bar\",\n      data:{ labels: itemEntries.map(e=>e[0]), datasets:[{ label:\"Jumlah PR/RB\", data: itemEntries.map(e=>e[1]), backgroundColor:\"#e08a7d\" }] },\n      options:{ indexAxis:\"y\", responsive:true, maintainAspectRatio:false, scales:{ x:{beginAtZero:true, ticks:{stepSize:1}} }, plugins:{legend:{display:false}} }\n    });\n  }catch(err){\n    errBox.textContent = \"⚠️ Grafik gagal ditampilkan: \" + err.message;\n    errBox.style.display = \"block\";\n  }\n}\ndocument.getElementById(\"refreshChartBtn\").addEventListener(\"click\", renderChartView);\ndocument.querySelectorAll(\"#view-chart .tab\").forEach(t => t.addEventListener(\"click\", () => {\n  chartType = t.dataset.charttype;\n  document.querySelectorAll(\"#view-chart .tab\").forEach(x => x.classList.toggle(\"active\", x===t));\n  renderChartView();\n}));\n\n// ===================== REKAP TRIWULAN =====================\nconst QUARTER_MONTHS = { 1:[1,2,3], 2:[4,5,6], 3:[7,8,9], 4:[10,11,12] };\nconst TYPE_LABEL = { toilet:{icon:\"🚻\", name:\"Toilet\"}, ruangan:{icon:\"🏢\", name:\"Ruangan\"} };\n\nasync function renderQuarter(){\n  const q = +document.getElementById(\"quarterSelect\").value;\n  const year = +document.getElementById(\"quarterYear\").value;\n  const months = QUARTER_MONTHS[q];\n  const monthKeys = months.map(m => `${year}-${String(m).padStart(2,\"0\")}`);\n  const host = document.getElementById(\"quarterHost\");\n  host.innerHTML = `\u003cdiv class=\"empty-note\">Memuat data...\u003c/div>`;\n\n  let html = \"\";\n  const chartJobs = [];\n  for(const type of [\"toilet\",\"ruangan\"]){\n    const statsPerMonth = [];\n    const locPerMonth = [];\n    for(const mk of monthKeys){\n      statsPerMonth.push(await getMonthStats(type, mk));\n      locPerMonth.push(await loadLocation(type, mk));\n    }\n    const totalOk = statsPerMonth.reduce((s,x)=>s+x.ok,0);\n    const totalPr = statsPerMonth.reduce((s,x)=>s+x.pr,0);\n    const totalRb = statsPerMonth.reduce((s,x)=>s+x.rb,0);\n    const totalBlank = statsPerMonth.reduce((s,x)=>s+x.blank,0);\n    const cols = flatCols(type);\n    const perItemAgg = {}; cols.forEach(c => perItemAgg[c] = {pr:0, rb:0});\n    statsPerMonth.forEach(s => cols.forEach(c => { perItemAgg[c].pr += s.perItem[c].pr; perItemAgg[c].rb += s.perItem[c].rb; }));\n    const topIssues = Object.entries(perItemAgg).map(([k,v]) => [k, v.pr+v.rb]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,5);\n    const t = TYPE_LABEL[type];\n\n    html += `\u003cdiv class=\"recap-card\" style=\"margin-bottom:20px\">\n      \u003ch3>${t.icon} ${t.name} — Q${q} ${year}\u003c/h3>\n      \u003ctable class=\"recap-table\">\n        \u003ctr>\u003cth>Bulan\u003c/th>\u003cth>Lokasi\u003c/th>\u003cth>OK\u003c/th>\u003cth>PR\u003c/th>\u003cth>RB\u003c/th>\u003cth>Belum Diisi\u003c/th>\u003c/tr>\n        ${statsPerMonth.map((s,i) => `\u003ctr>\u003ctd>${BULAN_ID[months[i]-1]}\u003c/td>\u003ctd>${locPerMonth[i] && locPerMonth[i].trim() ? locPerMonth[i].trim() : \"-\"}\u003c/td>\u003ctd>${s.ok}\u003c/td>\u003ctd>${s.pr}\u003c/td>\u003ctd>${s.rb}\u003c/td>\u003ctd>${s.blank}\u003c/td>\u003c/tr>`).join(\"\")}\n        \u003ctr style=\"font-weight:700;background:#eef3ef\">\u003ctd colspan=\"2\">Total\u003c/td>\u003ctd>${totalOk}\u003c/td>\u003ctd>${totalPr}\u003c/td>\u003ctd>${totalRb}\u003c/td>\u003ctd>${totalBlank}\u003c/td>\u003c/tr>\n      \u003c/table>\n      \u003cdiv class=\"chart-box\">\u003ccanvas id=\"qChart-${type}\">\u003c/canvas>\u003c/div>\n      ${topIssues.length ? `\u003ch3 style=\"margin-top:16px\">⚠️ Item paling sering bermasalah\u003c/h3>\n        \u003cul class=\"issue-list\">${topIssues.map(([k,v]) => `\u003cli>${k} \u003cspan class=\"issue-badge\">${v}x\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>`\n        : `\u003cdiv class=\"empty-note\">Tidak ada item bermasalah pada triwulan ini 🎉\u003c/div>`}\n    \u003c/div>`;\n    chartJobs.push({ type, months, statsPerMonth });\n  }\n  host.innerHTML = html;\n\n  chartJobs.forEach(({type, months, statsPerMonth}) => {\n    const id = `qChart-${type}`;\n    destroyChart(id);\n    chartInstances[id] = new Chart(document.getElementById(id), {\n      type:\"bar\",\n      data:{ labels: months.map(m => BULAN_ID[m-1]), datasets:[\n        {label:\"OK\", data:statsPerMonth.map(s=>s.ok), backgroundColor:\"#7fc28c\"},\n        {label:\"PR\", data:statsPerMonth.map(s=>s.pr), backgroundColor:\"#f0c26a\"},\n        {label:\"RB\", data:statsPerMonth.map(s=>s.rb), backgroundColor:\"#e08a7d\"}\n      ]},\n      options:{ responsive:true, maintainAspectRatio:false, scales:{ x:{stacked:true}, y:{stacked:true, beginAtZero:true} }, plugins:{legend:{position:\"bottom\"}} }\n    });\n  });\n}\ndocument.getElementById(\"quarterLoadBtn\").addEventListener(\"click\", renderQuarter);\n\n// ===================== REKAP TAHUNAN =====================\nasync function renderYear(){\n  const year = +document.getElementById(\"yearSelect\").value;\n  const monthKeys = Array.from({length:12}, (_,i) => `${year}-${String(i+1).padStart(2,\"0\")}`);\n  const host = document.getElementById(\"yearHost\");\n  host.innerHTML = `\u003cdiv class=\"empty-note\">Memuat data...\u003c/div>`;\n\n  let html = \"\";\n  const chartJobs = [];\n  for(const type of [\"toilet\",\"ruangan\"]){\n    const statsPerMonth = [];\n    const locPerMonth = [];\n    for(const mk of monthKeys){\n      statsPerMonth.push(await getMonthStats(type, mk));\n      locPerMonth.push(await loadLocation(type, mk));\n    }\n    const totalOk = statsPerMonth.reduce((s,x)=>s+x.ok,0);\n    const totalPr = statsPerMonth.reduce((s,x)=>s+x.pr,0);\n    const totalRb = statsPerMonth.reduce((s,x)=>s+x.rb,0);\n    const totalBlank = statsPerMonth.reduce((s,x)=>s+x.blank,0);\n    const cols = flatCols(type);\n    const perItemAgg = {}; cols.forEach(c => perItemAgg[c] = {pr:0, rb:0});\n    statsPerMonth.forEach(s => cols.forEach(c => { perItemAgg[c].pr += s.perItem[c].pr; perItemAgg[c].rb += s.perItem[c].rb; }));\n    const topIssues = Object.entries(perItemAgg).map(([k,v]) => [k, v.pr+v.rb]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,5);\n    const t = TYPE_LABEL[type];\n\n    html += `\u003cdiv class=\"recap-card\" style=\"margin-bottom:20px\">\n      \u003ch3>${t.icon} ${t.name} — Tahun ${year}\u003c/h3>\n      \u003ctable class=\"recap-table\">\n        \u003ctr>\u003cth>Bulan\u003c/th>\u003cth>Lokasi\u003c/th>\u003cth>OK\u003c/th>\u003cth>PR\u003c/th>\u003cth>RB\u003c/th>\u003cth>Belum Diisi\u003c/th>\u003c/tr>\n        ${statsPerMonth.map((s,i) => `\u003ctr>\u003ctd>${BULAN_ID[i]}\u003c/td>\u003ctd>${locPerMonth[i] && locPerMonth[i].trim() ? locPerMonth[i].trim() : \"-\"}\u003c/td>\u003ctd>${s.ok}\u003c/td>\u003ctd>${s.pr}\u003c/td>\u003ctd>${s.rb}\u003c/td>\u003ctd>${s.blank}\u003c/td>\u003c/tr>`).join(\"\")}\n        \u003ctr style=\"font-weight:700;background:#eef3ef\">\u003ctd colspan=\"2\">Total\u003c/td>\u003ctd>${totalOk}\u003c/td>\u003ctd>${totalPr}\u003c/td>\u003ctd>${totalRb}\u003c/td>\u003ctd>${totalBlank}\u003c/td>\u003c/tr>\n      \u003c/table>\n      \u003cdiv class=\"chart-box tall\">\u003ccanvas id=\"yChart-${type}\">\u003c/canvas>\u003c/div>\n      ${topIssues.length ? `\u003ch3 style=\"margin-top:16px\">⚠️ Item paling sering bermasalah sepanjang tahun\u003c/h3>\n        \u003cul class=\"issue-list\">${topIssues.map(([k,v]) => `\u003cli>${k} \u003cspan class=\"issue-badge\">${v}x\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>`\n        : `\u003cdiv class=\"empty-note\">Tidak ada item bermasalah sepanjang tahun ini 🎉\u003c/div>`}\n    \u003c/div>`;\n    chartJobs.push({ type, statsPerMonth });\n  }\n  host.innerHTML = html;\n\n  chartJobs.forEach(({type, statsPerMonth}) => {\n    const id = `yChart-${type}`;\n    destroyChart(id);\n    chartInstances[id] = new Chart(document.getElementById(id), {\n      type:\"bar\",\n      data:{ labels: BULAN_ID.map(m=>m.slice(0,3)), datasets:[\n        {label:\"OK\", data:statsPerMonth.map(s=>s.ok), backgroundColor:\"#7fc28c\"},\n        {label:\"PR\", data:statsPerMonth.map(s=>s.pr), backgroundColor:\"#f0c26a\"},\n        {label:\"RB\", data:statsPerMonth.map(s=>s.rb), backgroundColor:\"#e08a7d\"}\n      ]},\n      options:{ responsive:true, maintainAspectRatio:false, scales:{ x:{stacked:true}, y:{stacked:true, beginAtZero:true} }, plugins:{legend:{position:\"bottom\"}} }\n    });\n  });\n}\ndocument.getElementById(\"yearLoadBtn\").addEventListener(\"click\", renderYear);\n\nfunction populateYearSelects(){\n  const curYear = new Date().getFullYear();\n  const opts = [];\n  for(let y=curYear-3; y\u003c=curYear+1; y++) opts.push(`\u003coption value=\"${y}\" ${y===curYear?\"selected\":\"\"}>${y}\u003c/option>`);\n  document.getElementById(\"quarterYear\").innerHTML = opts.join(\"\");\n  document.getElementById(\"yearSelect\").innerHTML = opts.join(\"\");\n  document.getElementById(\"quarterSelect\").value = Math.floor(new Date().getMonth()/3) + 1;\n}\n\n// ===================== CETAK / PRINT LAPORAN =====================\nfunction escapeHtml(s){ return String(s||\"\").replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\"); }\nfunction nowStr(){\n  return new Date().toLocaleString(\"id-ID\", { day:\"numeric\", month:\"long\", year:\"numeric\", hour:\"2-digit\", minute:\"2-digit\" }) + \" WIB\";\n}\n\nconst PRINT_CSS = `\n  *{box-sizing:border-box}\n  body{ font-family:Georgia,'Times New Roman',serif; color:#1c2a2e; margin:0; padding:26px; }\n  .print-doc{ max-width:1100px; margin:0 auto; }\n  .print-header{ text-align:center; border-bottom:3px double #123a36; padding-bottom:14px; margin-bottom:22px; }\n  .print-header h1{ margin:0; font-size:21px; letter-spacing:1px; color:#123a36; text-transform:uppercase; }\n  .print-header .meta{ font-size:12px; color:#555; margin-top:6px; letter-spacing:.3px; }\n  .print-section{ margin-bottom:26px; }\n  .print-section + .print-section{ page-break-before:always; }\n  .print-section h2{ font-size:15px; color:#123a36; border-bottom:1.5px solid #123a36; padding-bottom:5px; margin-bottom:12px; text-transform:uppercase; letter-spacing:.5px; }\n  .print-info{ display:flex; gap:28px; font-size:11.5px; margin-bottom:10px; }\n  .print-info b{ color:#123a36; }\n  table.print-table{ width:100%; border-collapse:collapse; font-size:9px; margin-bottom:12px; }\n  table.print-table th, table.print-table td{ border:1px solid #9fb0ac; padding:3px 4px; text-align:center; }\n  table.print-table thead th{ background:#e4ece9; font-weight:700; color:#123a36; }\n  table.print-table tbody tr:nth-child(even){ background:#f7f7f2; }\n  table.print-table td.status-OK{ color:#256b32; font-weight:700; }\n  table.print-table td.status-PR{ color:#946a12; font-weight:700; }\n  table.print-table td.status-RB{ color:#a3352b; font-weight:700; }\n  .print-summary-cards{ display:flex; gap:14px; margin:10px 0 12px; font-size:11px; }\n  .print-summary-cards div{ border:1px solid #ccc; border-radius:6px; padding:5px 12px; }\n  .print-bar{ display:flex; height:13px; border-radius:3px; overflow:hidden; border:1px solid #bbb; }\n  .print-bar span{ display:block; height:100%; }\n  .print-bar .seg-ok{ background:#7fc28c; }\n  .print-bar .seg-pr{ background:#f0c26a; }\n  .print-bar .seg-rb{ background:#e08a7d; }\n  .print-notes{ font-size:11px; white-space:pre-wrap; border:1px solid #ccc; border-radius:6px; padding:8px 10px; background:#fdfaf1; margin-top:4px; }\n  .print-issues{ font-size:11px; margin-top:8px; }\n  .print-footer{ margin-top:26px; font-size:9.5px; color:#777; text-align:right; border-top:1px solid #ccc; padding-top:6px; }\n  .print-toolbar{ max-width:1100px; margin:0 auto 16px; text-align:right; display:flex; justify-content:flex-end; gap:10px; }\n  .print-toolbar button{\n    font-family:'Segoe UI',system-ui,sans-serif; cursor:pointer; border:none; border-radius:8px;\n    padding:9px 18px; font-size:13px; font-weight:700; background:#1f5c56; color:#fff;\n  }\n  .print-toolbar button:disabled{ opacity:.6; cursor:wait; }\n  .print-toolbar #downloadPdfBtn{ background:#c98a1e; }\n  @media print{\n    .print-toolbar{ display:none; }\n    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }\n    @page{ size:A4 portrait; margin:14mm; }\n  }\n`;\n\nfunction openPrintWindow(bodyHtml, title){\n  const safeFileName = title.replace(/[^a-z0-9\\-_ ]/gi, \"\").trim().replace(/\\s+/g, \"_\") || \"Laporan\";\n  const doc = `\u003c!DOCTYPE html>\u003chtml lang=\"id\">\u003chead>\u003cmeta charset=\"UTF-8\">\u003ctitle>${escapeHtml(title)}\u003c/title>\n    \u003cstyle>${PRINT_CSS}\u003c/style>\n    \u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js\">\u003c\\/script>\n    \u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\">\u003c\\/script>\n    \u003c/head>\u003cbody>\n    \u003cdiv class=\"print-toolbar\">\n      \u003cbutton onclick=\"window.print()\">🖨️ Cetak\u003c/button>\n      \u003cbutton id=\"downloadPdfBtn\" onclick=\"downloadAsPDF()\">⬇ Download PDF\u003c/button>\n    \u003c/div>\n    ${bodyHtml}\n    \u003cscript>\n      async function downloadAsPDF(){\n        const btn = document.getElementById(\"downloadPdfBtn\");\n        const original = btn.textContent;\n        if(typeof html2canvas === \"undefined\" || typeof window.jspdf === \"undefined\"){\n          alert(\"Library pembuat PDF gagal dimuat dari internet. Cek koneksi Anda, atau gunakan tombol Cetak lalu pilih \\\\\"Save as PDF\\\\\" sebagai alternatif.\");\n          return;\n        }\n        btn.textContent = \"Menyiapkan PDF...\"; btn.disabled = true;\n        try{\n          const target = document.querySelector(\".print-doc\");\n          const canvas = await html2canvas(target, { scale:2, backgroundColor:\"#ffffff\", useCORS:true });\n          const { jsPDF } = window.jspdf;\n          const pdf = new jsPDF({ orientation:\"portrait\", unit:\"pt\", format:\"a4\" });\n          const pageWidth = pdf.internal.pageSize.getWidth();\n          const pageHeight = pdf.internal.pageSize.getHeight();\n          const imgWidth = pageWidth;\n          const ratio = imgWidth / canvas.width;\n          const imgHeight = canvas.height * ratio;\n          const imgData = canvas.toDataURL(\"image/jpeg\", 0.95);\n          let heightLeft = imgHeight, position = 0;\n          pdf.addImage(imgData, \"JPEG\", 0, position, imgWidth, imgHeight);\n          heightLeft -= pageHeight;\n          while(heightLeft > 0){\n            position = heightLeft - imgHeight;\n            pdf.addPage();\n            pdf.addImage(imgData, \"JPEG\", 0, position, imgWidth, imgHeight);\n            heightLeft -= pageHeight;\n          }\n          pdf.save(\"${safeFileName}.pdf\");\n        }catch(e){\n          alert(\"Gagal membuat PDF: \" + e.message + \"\\\\n\\\\nSilakan gunakan tombol Cetak dan pilih \\\\\"Save as PDF\\\\\" sebagai alternatif.\");\n        }finally{\n          btn.textContent = original; btn.disabled = false;\n        }\n      }\n    \u003c\\/script>\n    \u003c/body>\u003c/html>`;\n  const win = window.open(\"\", \"_blank\");\n  if(!win){\n    alert(\"Pop-up diblokir oleh browser. Mohon izinkan pop-up untuk halaman ini (biasanya ada ikon di address bar), lalu klik tombol print lagi.\");\n    return false;\n  }\n  win.document.open();\n  win.document.write(doc);\n  win.document.close();\n  return true;\n}\n\nfunction buildPrintDailySection(type, rows, location, notes){\n  const schema = SCHEMA[type];\n  const cols = flatCols(type);\n  let ok=0, pr=0, rb=0, blank=0;\n  rows.forEach(r => cols.forEach(c => { const v=r.values[c]; if(v===\"OK\")ok++; else if(v===\"PR\")pr++; else if(v===\"RB\")rb++; else blank++; }));\n  const total = ok+pr+rb+blank;\n  const pct = n => total ? (n/total*100) : 0;\n\n  let theadGroups = `\u003cth rowspan=\"2\">Tgl\u003c/th>\u003cth rowspan=\"2\">Petugas\u003c/th>`;\n  schema.groups.forEach(g => theadGroups += `\u003cth colspan=\"${g.cols.length}\">${g.name}\u003c/th>`);\n  theadGroups += `\u003cth rowspan=\"2\">Keterangan\u003c/th>`;\n  const theadSub = cols.map(c => `\u003cth>${c}\u003c/th>`).join(\"\");\n\n  const bodyRows = rows.map(row => {\n    let cells = `\u003ctd>${row.day}\u003c/td>\u003ctd>${escapeHtml(row.petugas)||\"-\"}\u003c/td>`;\n    cols.forEach(c => { const v = row.values[c]||\"\"; cells += `\u003ctd class=\"status-${v||'blank'}\">${v||\"—\"}\u003c/td>`; });\n    cells += `\u003ctd style=\"text-align:left\">${escapeHtml(row.keterangan)}\u003c/td>`;\n    return `\u003ctr>${cells}\u003c/tr>`;\n  }).join(\"\");\n\n  return `\n  \u003cdiv class=\"print-section\">\n    \u003ch2>Checklist ${schema.label===\"TOILET\"?\"Toilet\":\"Ruangan\"}\u003c/h2>\n    \u003cdiv class=\"print-info\">\n      \u003cdiv>\u003cb>Lokasi:\u003c/b> ${escapeHtml(location) || \"-\"}\u003c/div>\n      \u003cdiv>\u003cb>Total Item Diperiksa:\u003c/b> ${total}\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"print-summary-cards\">\n      \u003cdiv>✅ OK: \u003cb>${ok}\u003c/b>\u003c/div>\n      \u003cdiv>⚠️ PR: \u003cb>${pr}\u003c/b>\u003c/div>\n      \u003cdiv>🛑 RB: \u003cb>${rb}\u003c/b>\u003c/div>\n      \u003cdiv>— Belum diisi: \u003cb>${blank}\u003c/b>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"print-bar\">\n      \u003cspan class=\"seg-ok\" style=\"width:${pct(ok)}%\">\u003c/span>\n      \u003cspan class=\"seg-pr\" style=\"width:${pct(pr)}%\">\u003c/span>\n      \u003cspan class=\"seg-rb\" style=\"width:${pct(rb)}%\">\u003c/span>\n    \u003c/div>\n    \u003ctable class=\"print-table\" style=\"margin-top:14px\">\n      \u003cthead>\u003ctr>${theadGroups}\u003c/tr>\u003ctr>${theadSub}\u003c/tr>\u003c/thead>\n      \u003ctbody>${bodyRows}\u003c/tbody>\n    \u003c/table>\n    ${notes && notes.trim() ? `\u003cdiv style=\"font-size:11px\">\u003cb>Catatan:\u003c/b>\u003c/div>\u003cdiv class=\"print-notes\">${escapeHtml(notes.trim())}\u003c/div>` : \"\"}\n  \u003c/div>`;\n}\n\nasync function printMonthlyReport(){\n  try{\n    const toiletRows = (cache.toilet && cache.toilet.length===daysInMonth(monthKey)) ? cache.toilet : await loadData(\"toilet\", monthKey);\n    const ruanganRows = (cache.ruangan && cache.ruangan.length===daysInMonth(monthKey)) ? cache.ruangan : await loadData(\"ruangan\", monthKey);\n    const toiletLoc = activeType===\"toilet\" ? currentLocation : await loadLocation(\"toilet\", monthKey);\n    const ruanganLoc = activeType===\"ruangan\" ? currentLocation : await loadLocation(\"ruangan\", monthKey);\n    const toiletNotes = activeType===\"toilet\" ? currentNotes : await loadNotes(\"toilet\", monthKey);\n    const ruanganNotes = activeType===\"ruangan\" ? currentNotes : await loadNotes(\"ruangan\", monthKey);\n\n    const html = `\u003cdiv class=\"print-doc\">\n      \u003cdiv class=\"print-header\">\n        \u003ch1>Laporan Checklist Kebersihan Bulanan\u003c/h1>\n        \u003cdiv class=\"meta\">${monthLabel(monthKey)}\u003c/div>\n      \u003c/div>\n      ${buildPrintDailySection(\"toilet\", toiletRows, toiletLoc, toiletNotes)}\n      ${buildPrintDailySection(\"ruangan\", ruanganRows, ruanganLoc, ruanganNotes)}\n      \u003cdiv class=\"print-footer\">Dicetak melalui Sistem Checklist Kebersihan (SCK) pada ${nowStr()} · SCK © Adamanstywn\u003c/div>\n    \u003c/div>`;\n    openPrintWindow(html, `Laporan Bulanan - ${monthLabel(monthKey)}`);\n  }catch(err){\n    alert(\"Gagal menyiapkan laporan untuk dicetak: \" + err.message);\n  }\n}\n\nfunction buildPrintRecapSection(sectionTitle, statsPerMonth, monthLabels, locPerMonth, topIssues, notesPerMonth){\n  const totals = statsPerMonth.reduce((a,s) => ({ok:a.ok+s.ok, pr:a.pr+s.pr, rb:a.rb+s.rb, blank:a.blank+s.blank}), {ok:0,pr:0,rb:0,blank:0});\n  const bodyRows = statsPerMonth.map((s,i) => {\n    const total = s.ok+s.pr+s.rb+s.blank;\n    const pct = n => total ? (n/total*100) : 0;\n    return `\u003ctr>\n      \u003ctd>${monthLabels[i]}\u003c/td>\n      \u003ctd>${escapeHtml(locPerMonth[i]) || \"-\"}\u003c/td>\n      \u003ctd class=\"status-OK\">${s.ok}\u003c/td>\n      \u003ctd class=\"status-PR\">${s.pr}\u003c/td>\n      \u003ctd class=\"status-RB\">${s.rb}\u003c/td>\n      \u003ctd>${s.blank}\u003c/td>\n      \u003ctd style=\"min-width:90px\">\u003cdiv class=\"print-bar\">\u003cspan class=\"seg-ok\" style=\"width:${pct(s.ok)}%\">\u003c/span>\u003cspan class=\"seg-pr\" style=\"width:${pct(s.pr)}%\">\u003c/span>\u003cspan class=\"seg-rb\" style=\"width:${pct(s.rb)}%\">\u003c/span>\u003c/div>\u003c/td>\n    \u003c/tr>`;\n  }).join(\"\");\n\n  const notesEntries = (notesPerMonth || []).map((n,i) => [monthLabels[i], n]).filter(([,n]) => n && n.trim());\n  const notesHtml = notesEntries.length\n    ? `\u003cdiv style=\"margin-top:10px\">\u003cdiv style=\"font-size:11px\">\u003cb>📝 Catatan per Bulan:\u003c/b>\u003c/div>\n        ${notesEntries.map(([m,n]) => `\u003cdiv class=\"print-notes\" style=\"margin-top:6px\">\u003cb>${m}:\u003c/b> ${escapeHtml(n.trim())}\u003c/div>`).join(\"\")}\n      \u003c/div>`\n    : \"\";\n\n  return `\u003cdiv class=\"print-section\">\n    \u003ch2>${sectionTitle}\u003c/h2>\n    \u003ctable class=\"print-table\" style=\"font-size:10.5px\">\n      \u003cthead>\u003ctr>\u003cth>Bulan\u003c/th>\u003cth>Lokasi\u003c/th>\u003cth>OK\u003c/th>\u003cth>PR\u003c/th>\u003cth>RB\u003c/th>\u003cth>Belum Diisi\u003c/th>\u003cth>Komposisi\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        ${bodyRows}\n        \u003ctr style=\"font-weight:700;background:#eef3ef\">\u003ctd colspan=\"2\">Total\u003c/td>\u003ctd>${totals.ok}\u003c/td>\u003ctd>${totals.pr}\u003c/td>\u003ctd>${totals.rb}\u003c/td>\u003ctd>${totals.blank}\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n    \u003cdiv class=\"print-issues\">${topIssues.length ? `\u003cb>⚠️ Item paling sering bermasalah:\u003c/b> ${topIssues.map(([k,v]) => `${k} (${v}x)`).join(\", \")}` : `Tidak ada item bermasalah pada periode ini.`}\u003c/div>\n    ${notesHtml}\n  \u003c/div>`;\n}\n\nasync function collectRecapData(type, monthKeys){\n  const statsPerMonth = [], locPerMonth = [], notesPerMonth = [];\n  for(const mk of monthKeys){\n    statsPerMonth.push(await getMonthStats(type, mk));\n    locPerMonth.push(await loadLocation(type, mk));\n    notesPerMonth.push(await loadNotes(type, mk));\n  }\n  const cols = flatCols(type);\n  const perItemAgg = {}; cols.forEach(c => perItemAgg[c] = {pr:0, rb:0});\n  statsPerMonth.forEach(s => cols.forEach(c => { perItemAgg[c].pr += s.perItem[c].pr; perItemAgg[c].rb += s.perItem[c].rb; }));\n  const topIssues = Object.entries(perItemAgg).map(([k,v]) => [k, v.pr+v.rb]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,5);\n  return { statsPerMonth, locPerMonth, notesPerMonth, topIssues };\n}\n\nasync function printQuarterRecap(){\n  try{\n    const q = +document.getElementById(\"quarterSelect\").value;\n    const year = +document.getElementById(\"quarterYear\").value;\n    const months = QUARTER_MONTHS[q];\n    const monthKeys = months.map(m => `${year}-${String(m).padStart(2,\"0\")}`);\n    const monthLabels = months.map(m => BULAN_ID[m-1]);\n\n    let sections = \"\";\n    for(const type of [\"toilet\",\"ruangan\"]){\n      const { statsPerMonth, locPerMonth, notesPerMonth, topIssues } = await collectRecapData(type, monthKeys);\n      sections += buildPrintRecapSection(`${TYPE_LABEL[type].icon} ${TYPE_LABEL[type].name}`, statsPerMonth, monthLabels, locPerMonth, topIssues, notesPerMonth);\n    }\n    const html = `\u003cdiv class=\"print-doc\">\n      \u003cdiv class=\"print-header\">\n        \u003ch1>Rekap Triwulan Checklist Kebersihan\u003c/h1>\n        \u003cdiv class=\"meta\">Triwulan ${q} (${monthLabels[0]} – ${monthLabels[2]} ${year})\u003c/div>\n      \u003c/div>\n      ${sections}\n      \u003cdiv class=\"print-footer\">Dicetak melalui Sistem Checklist Kebersihan (SCK) pada ${nowStr()} · SCK © Adamanstywn\u003c/div>\n    \u003c/div>`;\n    openPrintWindow(html, `Rekap Triwulan Q${q} ${year}`);\n  }catch(err){\n    alert(\"Gagal menyiapkan rekap untuk dicetak: \" + err.message);\n  }\n}\n\nasync function printYearRecap(){\n  try{\n    const year = +document.getElementById(\"yearSelect\").value;\n    const monthKeys = Array.from({length:12}, (_,i) => `${year}-${String(i+1).padStart(2,\"0\")}`);\n\n    let sections = \"\";\n    for(const type of [\"toilet\",\"ruangan\"]){\n      const { statsPerMonth, locPerMonth, notesPerMonth, topIssues } = await collectRecapData(type, monthKeys);\n      sections += buildPrintRecapSection(`${TYPE_LABEL[type].icon} ${TYPE_LABEL[type].name}`, statsPerMonth, BULAN_ID, locPerMonth, topIssues, notesPerMonth);\n    }\n    const html = `\u003cdiv class=\"print-doc\">\n      \u003cdiv class=\"print-header\">\n        \u003ch1>Rekap Tahunan Checklist Kebersihan\u003c/h1>\n        \u003cdiv class=\"meta\">Tahun ${year}\u003c/div>\n      \u003c/div>\n      ${sections}\n      \u003cdiv class=\"print-footer\">Dicetak melalui Sistem Checklist Kebersihan (SCK) pada ${nowStr()} · SCK © Adamanstywn\u003c/div>\n    \u003c/div>`;\n    openPrintWindow(html, `Rekap Tahunan ${year}`);\n  }catch(err){\n    alert(\"Gagal menyiapkan rekap untuk dicetak: \" + err.message);\n  }\n}\n\ndocument.getElementById(\"printMonthBtn\").addEventListener(\"click\", printMonthlyReport);\ndocument.getElementById(\"printQuarterBtn\").addEventListener(\"click\", printQuarterRecap);\ndocument.getElementById(\"printYearBtn\").addEventListener(\"click\", printYearRecap);\n\ndocument.querySelectorAll(\"#view-input .tab\").forEach(t => t.addEventListener(\"click\", () => switchType(t.dataset.type)));\ndocument.getElementById(\"exportBtn\").addEventListener(\"click\", exportExcel);\ndocument.getElementById(\"resetBtn\").addEventListener(\"click\", resetMonth);\ndocument.getElementById(\"monthPicker\").addEventListener(\"change\", (e) => switchMonth(e.target.value));\ndocument.getElementById(\"monthPicker\").value = monthKey;\npopulateYearSelects();\n\n// ===================== TUTORIAL ONBOARDING =====================\nconst TUTORIAL_SEEN_KEY = \"checklist:tutorialSeen\";\nconst TUTORIAL_STEPS = [\n  { target:\"#monthPicker\", title:\"1. Pilih Bulan\", desc:\"Mulai dengan memilih bulan yang mau diisi checklist-nya. Data setiap bulan disimpan terpisah.\" },\n  { target:\"#locationInput\", title:\"2. Isi Lokasi Pemeriksaan\", desc:\"Tulis lokasi yang diperiksa, misalnya \\\"Toilet Pria Lantai 2 - Gedung A\\\", supaya jelas di laporan.\" },\n  { target:\"#notesInput\", title:\"3. Catatan Umum (Opsional)\", desc:\"Kalau ada hal khusus bulan ini (misal AC rusak menunggu sparepart), tulis di sini.\" },\n  { target:\".status-btn\", title:\"4. Isi Status Harian\", desc:\"Klik satu sel untuk memilih indikator lewat popup (OK / PR / RB / Kosong). Bisa juga klik & seret untuk menyamakan banyak sel sekaligus.\" },\n  { target:\".col-fill\", title:\"5. Isi Cepat Satu Kolom/Baris\", desc:\"Klik tombol \\\"isi kolom\\\" di judul kolom, atau ⚡ di sebelah tanggal, untuk mengisi satu kolom/baris penuh sekaligus.\" },\n  { target:\".mini-bar-wrap\", title:\"6. Grafik Real-time\", desc:\"Grafik komposisi ini otomatis bergerak mengikuti isian Anda secara langsung.\" },\n  { target:\".view-nav\", title:\"7. Grafik & Rekap\", desc:\"Lihat tren grafik bulanan, atau rekap otomatis per triwulan/tahunan di menu ini.\" },\n  { target:\"#exportBtn\", title:\"8. Export & Cetak\", desc:\"Setelah selesai, export ke Excel dengan format laporan resmi, atau cetak langsung lewat tombol Print.\" },\n  { target:\"#resetAllBtn\", title:\"9. Reset Semua Data\", desc:\"Kalau perlu mulai dari nol, tombol ini akan menghapus SEMUA data di perangkat ini secara permanen. Gunakan dengan hati-hati!\" }\n];\nlet tutorialIndex = 0;\nlet tutorialResizeHandler = null;\n\nfunction positionTutorialStep(){\n  const step = TUTORIAL_STEPS[tutorialIndex];\n  const target = document.querySelector(step.target);\n  const spotlight = document.getElementById(\"tutorialSpotlight\");\n  const card = document.getElementById(\"tutorialCard\");\n  if(!target){ tNext_skipMissing(); return; }\n  target.scrollIntoView({ behavior:\"smooth\", block:\"center\" });\n  setTimeout(() => {\n    const rect = target.getBoundingClientRect();\n    const pad = 8;\n    spotlight.style.left = (rect.left - pad) + \"px\";\n    spotlight.style.top = (rect.top - pad) + \"px\";\n    spotlight.style.width = (rect.width + pad*2) + \"px\";\n    spotlight.style.height = (rect.height + pad*2) + \"px\";\n\n    document.getElementById(\"tStep\").textContent = `Langkah ${tutorialIndex+1} dari ${TUTORIAL_STEPS.length}`;\n    document.getElementById(\"tTitle\").textContent = step.title;\n    document.getElementById(\"tDesc\").textContent = step.desc;\n    document.getElementById(\"tPrev\").style.visibility = tutorialIndex===0 ? \"hidden\" : \"visible\";\n    document.getElementById(\"tNext\").textContent = tutorialIndex===TUTORIAL_STEPS.length-1 ? \"Selesai ✓\" : \"Lanjut →\";\n\n    const cw = card.offsetWidth || 320, ch = card.offsetHeight || 160;\n    let top = rect.bottom + pad + 14;\n    let left = Math.min(Math.max(8, rect.left), window.innerWidth - cw - 8);\n    if(top + ch > window.innerHeight - 10) top = Math.max(10, rect.top - ch - 14);\n    card.style.left = left + \"px\";\n    card.style.top = top + \"px\";\n  }, 220);\n}\nfunction tNext_skipMissing(){ if(tutorialIndex \u003c TUTORIAL_STEPS.length-1){ tutorialIndex++; positionTutorialStep(); } else { endTutorial(); } }\n\nfunction startTutorial(){\n  tutorialIndex = 0;\n  document.getElementById(\"tutorialOverlay\").style.display = \"block\";\n  positionTutorialStep();\n  tutorialResizeHandler = () => positionTutorialStep();\n  window.addEventListener(\"resize\", tutorialResizeHandler);\n}\nfunction endTutorial(){\n  document.getElementById(\"tutorialOverlay\").style.display = \"none\";\n  if(tutorialResizeHandler) window.removeEventListener(\"resize\", tutorialResizeHandler);\n  try{ localStorage.setItem(TUTORIAL_SEEN_KEY, \"1\"); }catch(e){ /* ignore */ }\n}\ndocument.getElementById(\"tNext\").addEventListener(\"click\", () => {\n  if(tutorialIndex >= TUTORIAL_STEPS.length-1){ endTutorial(); return; }\n  tutorialIndex++;\n  positionTutorialStep();\n});\ndocument.getElementById(\"tPrev\").addEventListener(\"click\", () => {\n  if(tutorialIndex > 0){ tutorialIndex--; positionTutorialStep(); }\n});\ndocument.getElementById(\"tSkip\").addEventListener(\"click\", endTutorial);\ndocument.getElementById(\"helpBtn\").addEventListener(\"click\", startTutorial);\n\n// ===================== RESET SEMUA DATA =====================\ndocument.getElementById(\"resetAllBtn\").addEventListener(\"click\", async () => {\n  const ok1 = confirm(\"⚠️ PERINGATAN: Ini akan menghapus SEMUA data checklist, lokasi, dan catatan (semua bulan & tahun) yang tersimpan di database (berlaku untuk semua pengguna) secara PERMANEN.\\n\\nLanjutkan?\");\n  if(!ok1) return;\n  const ok2 = confirm(\"Konfirmasi sekali lagi — benar-benar ingin menghapus semua data dan mulai dari awal?\");\n  if(!ok2) return;\n  try{\n    const db = await storage._db();\n    if(db){\n      const sn = await db.collection(\"checklist\").get();\n      for(let i = 0; i \u003c sn.docs.length; i += 400){\n        const b = db.batch();\n        sn.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));\n        await b.commit();\n      }\n    }\n    const keysToRemove = [];\n    for(let i=0; i\u003clocalStorage.length; i++){\n      const k = localStorage.key(i);\n      if(k && k.startsWith(\"checklist:\")) keysToRemove.push(k);\n    }\n    keysToRemove.forEach(k => localStorage.removeItem(k));\n    alert(\"Semua data telah dihapus. Aplikasi akan dimuat ulang.\");\n    location.reload();\n  }catch(e){\n    alert(\"Gagal menghapus data: \" + e.message);\n  }\n});\n\nasync function initApp(){\n  cache.toilet = await loadData(\"toilet\", monthKey);\n  cache.ruangan = await loadData(\"ruangan\", monthKey);\n  renderTable();\n  await loadCurrentLocation();\n  await loadCurrentNotes();\n  let alreadySeen = false;\n  try{ alreadySeen = localStorage.getItem(TUTORIAL_SEEN_KEY) === \"1\"; }catch(e){ /* ignore */ }\n  if(!alreadySeen) setTimeout(startTutorial, 500);\n}\n\n// ===================== LOGIN GATE =====================\nconst LOGIN_KEY = \"checklist:loggedIn\";\nconst VALID_USERNAME = \"admin\";\nconst VALID_PASSWORD = \"12345\";\n\nfunction showApp(){\n  document.getElementById(\"loginPage\").style.display = \"none\";\n  document.getElementById(\"appContent\").style.display = \"block\";\n  initApp();\n}\nfunction showLogin(){\n  document.getElementById(\"appContent\").style.display = \"none\";\n  document.getElementById(\"loginPage\").style.display = \"flex\";\n}\n\ndocument.getElementById(\"loginForm\").addEventListener(\"submit\", (e) => {\n  e.preventDefault();\n  const u = document.getElementById(\"loginUsername\").value.trim();\n  const p = document.getElementById(\"loginPassword\").value;\n  const errEl = document.getElementById(\"loginError\");\n  if(u === VALID_USERNAME && p === VALID_PASSWORD){\n    try{ localStorage.setItem(LOGIN_KEY, \"1\"); }catch(err){ /* ignore */ }\n    errEl.style.display = \"none\";\n    showApp();\n  }else{\n    errEl.textContent = \"Username atau password salah. Coba lagi.\";\n    errEl.style.display = \"block\";\n  }\n});\ndocument.getElementById(\"logoutBtn\").addEventListener(\"click\", () => {\n  if(!confirm(\"Keluar dari aplikasi?\")) return;\n  try{ localStorage.removeItem(LOGIN_KEY); }catch(e){ /* ignore */ }\n  document.getElementById(\"loginUsername\").value = \"\";\n  document.getElementById(\"loginPassword\").value = \"\";\n  showLogin();\n});\n\n// ===================== TENTANG APLIKASI =====================\ndocument.getElementById(\"aboutBtn\").addEventListener(\"click\", () => {\n  document.getElementById(\"aboutModal\").style.display = \"flex\";\n});\ndocument.getElementById(\"closeAboutBtn\").addEventListener(\"click\", () => {\n  document.getElementById(\"aboutModal\").style.display = \"none\";\n});\ndocument.getElementById(\"aboutModal\").addEventListener(\"click\", (e) => {\n  if(e.target.id === \"aboutModal\") document.getElementById(\"aboutModal\").style.display = \"none\";\n});\n\n// ===================== SPLASH SCREEN =====================\nsetTimeout(() => {\n  const splash = document.getElementById(\"splashScreen\");\n  splash.classList.add(\"hide\");\n  setTimeout(() => { splash.style.display = \"none\"; }, 650);\n\n  let loggedIn = false;\n  try{ loggedIn = localStorage.getItem(LOGIN_KEY) === \"1\"; }catch(e){ /* ignore */ }\n  if(loggedIn) showApp(); else showLogin();\n}, 1700);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

</script>
